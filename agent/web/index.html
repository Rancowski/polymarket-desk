<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080c0b" />
  <title>Fjord · Prediksjonsdesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #080c0b; --surface: #121918; --raised: #18211f;
      --fg: #e8eeea; --muted: #8b9c95; --subtle: #5e6e68;
      --border: color-mix(in oklab, #e8eeea 12%, transparent);
      --gain: #3d9b78; --loss: #c45c4a; --warn: #c4a35a; --primary: #d7e0dc;
    }
    * { box-sizing: border-box; border-color: var(--border); }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg);
      font-family: "IBM Plex Sans", system-ui, sans-serif; }
    button { font: inherit; cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .wrap { max-width: 72rem; margin: 0 auto; padding: 0 1rem 6rem; }
    header { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(12px);
      background: color-mix(in oklab, var(--bg) 92%, transparent); border-bottom: 1px solid var(--border); }
    header .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: .75rem; padding: .85rem 0; }
    .brand { display: flex; align-items: center; gap: .75rem; min-width: 0; }
    .mark { width: 2rem; height: 2rem; border-radius: .6rem; background: var(--raised);
      border: 1px solid var(--border); display: grid; place-items: center; font-weight: 600; }
    .eyebrow { font-family: "IBM Plex Mono", monospace; font-size: .7rem; letter-spacing: .16em;
      text-transform: uppercase; color: var(--muted); margin: 0; }
    h1 { margin: 0; font-size: 1.15rem; font-weight: 600; }
    .pills { display: flex; flex-wrap: wrap; gap: .4rem; }
    .pill { font-family: "IBM Plex Mono", monospace; font-size: .72rem; border: 1px solid var(--border);
      border-radius: 999px; padding: .4rem .75rem; display: inline-flex; align-items: center; gap: .4rem; }
    .dot { width: .4rem; height: .4rem; border-radius: 99px; background: var(--subtle); }
    .on .dot { background: var(--gain); } .off .dot { background: var(--loss); }
    .on { color: var(--gain); border-color: color-mix(in oklab, var(--gain) 40%, transparent); }
    .off { color: var(--loss); border-color: color-mix(in oklab, var(--loss) 40%, transparent); }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: .5rem; margin-top: 1rem; }
    @media (min-width: 700px) { .grid { grid-template-columns: repeat(4, minmax(0,1fr)); } }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 1rem; padding: .9rem 1rem; }
    .stat span { display: block; color: var(--muted); font-size: .75rem; }
    .stat strong { display: block; margin-top: .2rem; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-top: 1rem; }
    @media (min-width: 700px) { .actions { display: flex; flex-wrap: wrap; } }
    .btn { min-height: 2.75rem; border-radius: .7rem; border: 1px solid var(--border);
      background: var(--raised); color: var(--fg); padding: 0 1rem; font-weight: 500; }
    .btn.primary { background: var(--primary); color: var(--bg); border-color: transparent; }
    .btn.danger { background: color-mix(in oklab, var(--loss) 18%, var(--surface)); color: var(--loss);
      border-color: color-mix(in oklab, var(--loss) 35%, transparent); }
    .tabs { display: flex; gap: .25rem; margin-top: 1.25rem; border-bottom: 1px solid var(--border); }
    .tabs button { background: none; border: 0; color: var(--muted); padding: .7rem .9rem; }
    .tabs button.active { color: var(--fg); box-shadow: inset 0 -2px 0 var(--primary); }
    .panel { margin-top: 1rem; }
    .row-item { background: var(--surface); border: 1px solid var(--border); border-radius: .85rem;
      padding: .85rem 1rem; margin-bottom: .5rem; }
    .q { font-size: .92rem; margin: 0 0 .35rem; }
    .meta { font-family: "IBM Plex Mono", monospace; font-size: .72rem; color: var(--muted); }
    .gain { color: var(--gain); } .loss { color: var(--loss); }
    .empty { color: var(--muted); padding: 1.5rem 0; }
    .err { margin-top: .75rem; padding: .75rem 1rem; border-radius: .75rem;
      border: 1px solid color-mix(in oklab, var(--loss) 30%, transparent);
      background: color-mix(in oklab, var(--loss) 10%, transparent); color: var(--loss); font-size: .9rem; }
    svg.spark { width: 100%; height: 88px; margin-top: 1rem; }
    .note { color: var(--subtle); font-size: .78rem; margin-top: .75rem; line-height: 1.45; }
    .cap { display: grid; gap: .5rem; grid-template-columns: 1fr; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); }
    @media (min-width: 700px) { .cap { grid-template-columns: 1fr 1fr auto; align-items: end; } }
    .cap label { display: block; color: var(--muted); font-size: .75rem; margin-bottom: .25rem; }
    .cap input { width: 100%; min-height: 2.5rem; border-radius: .6rem; border: 1px solid var(--border);
      background: var(--raised); color: var(--fg); padding: 0 .75rem; font: inherit; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="row">
        <div class="brand">
          <div class="mark">F</div>
          <div>
            <p class="eyebrow">Prediksjonsdesk</p>
            <h1>Fjord</h1>
          </div>
        </div>
        <div class="pills" id="pills"></div>
      </div>
    </div>
  </header>
  <main class="wrap">
    <div class="grid" id="stats"></div>
    <div class="actions">
      <button class="btn primary" id="btnOn" type="button">Slå på</button>
      <button class="btn danger" id="btnOff" type="button">Slå av</button>
      <button class="btn" id="btnOnce" type="button">Kjør én syklus</button>
      <button class="btn" id="btnUpd" type="button">Oppdater agent</button>
    </div>
    <div id="err"></div>
    <svg class="spark" id="spark" viewBox="0 0 320 88" preserveAspectRatio="none"></svg>
    <p class="note" id="cycle"></p>
    <div class="tabs">
      <button class="active" data-tab="pos" type="button">Posisjoner</button>
      <button data-tab="log" type="button">Logg</button>
      <button data-tab="fill" type="button">Fills</button>
    </div>
    <div class="panel" id="panel"></div>
    <form class="cap" id="cap">
      <div>
        <label for="dep">Innskutt på Polymarket (USD)</label>
        <input id="dep" name="deposited" type="number" min="1" step="0.01" inputmode="decimal" />
      </div>
      <div>
        <label for="xai">xAI-kreditter kjøpt totalt (USD)</label>
        <input id="xai" name="prepaid" type="number" min="0" step="0.01" inputmode="decimal" />
      </div>
      <button class="btn" type="submit">Lagre</button>
    </form>
  </main>
  <script>
    let tab = "pos";
    let state = null;
    const tokenKey = "fjord_token";
    const $ = (id) => document.getElementById(id);
    const token = () => sessionStorage.getItem(tokenKey) || new URLSearchParams(location.search).get("token") || "";
    const usd = (n) => (Number(n) || 0).toLocaleString("nb-NO", { style: "currency", currency: "USD", maximumFractionDigits: 2 });
    const clock = (iso) => {
      if (!iso) return "—";
      const d = new Date(iso);
      return Number.isNaN(d.getTime()) ? "—" : d.toLocaleString("nb-NO", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
    };
    async function api(path, method, body) {
      const headers = {};
      if (token()) headers["X-Dashboard-Token"] = token();
      if (body !== undefined) headers["Content-Type"] = "application/json";
      const r = await fetch(path, {
        method: method || "GET",
        headers,
        credentials: "same-origin",
        body: body !== undefined ? JSON.stringify(body) : undefined,
      });
      if (r.status === 401) {
        const t = window.prompt("Dashboard-token (DASHBOARD_TOKEN i .env)");
        if (t) { sessionStorage.setItem(tokenKey, t); return api(path, method, body); }
        throw new Error("Ingen tilgang");
      }
      const data = await r.json();
      if (!r.ok && r.status !== 409 && r.status !== 400) {
        throw new Error(data.reason || data.error || r.statusText);
      }
      return data;
    }
    function pills(s) {
      const live = s.dry_run ? "Paper" : "Live";
      const on = !s.halted;
      $("pills").innerHTML =
        `<span class="pill ${on ? "on" : "off"}"><span class="dot"></span>${on ? "Autopilot på" : "Stoppet"}</span>` +
        `<span class="pill">${live}</span>` +
        (s.busy ? `<span class="pill">Kjører syklus…</span>` : "");
    }
    const signed = (n) => (n > 0.004 ? "+" : n < -0.004 ? "\u2212" : "") + usd(Math.abs(n));
    const pctn = (n) => `${n >= 0 ? "+" : ""}${(n * 100).toFixed(1)} %`;
    function stats(s) {
      const st = s.stats || {};
      const tone = (n) => (n > 0.004 ? "gain" : n < -0.004 ? "loss" : "");
      const cards = [
        ["Egenkapital", usd(s.equity), ""],
        ["Kontanter", usd(s.bankroll), ""],
        ["Avkastning", `${signed(st.total || 0)} (${pctn(st.total_pct || 0)})`, tone(st.total || 0)],
        ["I dag", `${signed(st.day || 0)} (${pctn(st.day_pct || 0)})`, tone(st.day || 0)],
        ["7 dager", `${signed(st.week || 0)} (${pctn(st.week_pct || 0)})`, tone(st.week || 0)],
        ["Etter xAI", signed(st.after_xai || 0), tone(st.after_xai || 0)],
        ["Maks tap", `${signed(st.max_dd_usd || 0)} (${pctn(st.max_dd_pct || 0)})`, (st.max_dd_usd || 0) < -0.004 ? "loss" : ""],
        ["Innskutt", usd(st.deposited || 0), ""],
        ["I markedet", `${s.open} · ${usd(st.open_cost || 0)}`, ""],
        ["Handler", String(st.trades || 0), ""],
        ["xAI i dag", usd(st.xai_day || 0), ""],
        ["xAI brukt", usd(st.xai_total || 0), ""],
        ["xAI igjen", s.xai_remaining == null ? "fyll inn under" : usd(s.xai_remaining), s.xai_remaining != null && s.xai_remaining < 5 ? "loss" : ""],
      ];
      $("stats").innerHTML = cards.map(([l, v, c]) =>
        `<div class="stat"><span>${l}</span><strong class="${c}">${v}</strong></div>`
      ).join("");
    }
    function spark(hist) {
      const el = $("spark");
      if (!hist || hist.length < 2) { el.innerHTML = ""; return; }
      const vals = hist.map((h) => Number(h.equity) || 0);
      const min = Math.min(...vals), max = Math.max(...vals);
      const span = max - min || 1;
      const pts = vals.map((v, i) => {
        const x = (i / (vals.length - 1)) * 320;
        const y = 80 - ((v - min) / span) * 68;
        return `${x},${y}`;
      }).join(" ");
      el.innerHTML = `<polyline fill="none" stroke="#3d9b78" stroke-width="2" points="${pts}" />`;
    }
    function renderPanel(s) {
      const el = $("panel");
      if (tab === "pos") {
        if (!s.positions.length) { el.innerHTML = `<p class="empty">Ingen åpne posisjoner.</p>`; return; }
        el.innerHTML = s.positions.map((p) =>
          `<div class="row-item"><p class="q">${p.question || ""}</p>
           <div class="meta">${p.side} · ${Number(p.shares).toFixed(2)} andeler · snitt ${usd(p.avg_cost)} · ${p.category || ""}</div></div>`
        ).join("");
        return;
      }
      if (tab === "fill") {
        if (!s.fills.length) { el.innerHTML = `<p class="empty">Ingen fills ennå.</p>`; return; }
        el.innerHTML = s.fills.map((f) =>
          `<div class="row-item"><p class="q">${f.side} ${usd(f.cost)}</p>
           <div class="meta">${clock(f.ts)} · ${Number(f.size).toFixed(2)} @ ${Number(f.price).toFixed(3)} ${f.dry_run ? "· paper" : "· live"}</div></div>`
        ).join("");
        return;
      }
      if (!s.decisions.length) { el.innerHTML = `<p class="empty">Ingen beslutninger ennå.</p>`; return; }
      el.innerHTML = s.decisions.map((d) => {
        const tone = (d.action === "live" || d.action === "paper") ? "gain" : "";
        return `<div class="row-item"><p class="q">${d.question || ""}</p>
          <div class="meta ${tone}">${clock(d.ts)} · ${d.action || "—"} · ${d.reason || ""}</div></div>`;
      }).join("");
    }
    function paint(s) {
      state = s;
      pills(s);
      stats(s);
      spark(s.equity_history);
      const st = s.stats || {};
      const depEl = $("dep");
      const xaiEl = $("xai");
      if (depEl && document.activeElement !== depEl) depEl.value = st.deposited != null ? st.deposited : "";
      if (xaiEl && document.activeElement !== xaiEl) xaiEl.value = st.xai_prepaid != null ? st.xai_prepaid : "";
      const c = s.last_cycle;
      const next = c && c.ts ? new Date(new Date(c.ts).getTime() + (s.loop_seconds || 900) * 1000) : null;
      const rejects = (st.top_rejects || []).slice(0, 2).map((r) => `${r.n}× ${r.reason}`).join(" · ");
      $("cycle").textContent = c
        ? `Siste syklus ${clock(c.ts)} · neste ${next ? clock(next.toISOString()) : "—"} · skannet ${c.scanned || 0} · grok ${c.accepted || 0} · arb ${c.arb || 0} · kalshi ${c.kalshi || 0} · solgt ${c.exits || 0} · avvist ${c.rejected || 0}${rejects ? " · " + rejects : ""}`
        : "Venter på første syklus.";
      $("err").innerHTML = s.last_error ? `<div class="err">${s.last_error}</div>` : "";
      $("btnOn").disabled = !s.halted;
      $("btnOff").disabled = !!s.halted;
      if (s.busy) {
        $("btnOnce").disabled = true;
        $("btnOnce").textContent = "Kjører…";
      } else {
        $("btnOnce").disabled = false;
        $("btnOnce").textContent = "Kjør én syklus";
      }
      renderPanel(s);
    }
    async function refresh() {
      try { paint(await api("/api/state")); }
      catch (e) { $("err").innerHTML = `<div class="err">Kan ikke nå desken. Er main.py run i gang?</div>`; }
    }
    $("btnOn").onclick = async () => { await api("/api/on", "POST"); refresh(); };
    $("btnOff").onclick = async () => { await api("/api/off", "POST"); refresh(); };
    $("btnOnce").onclick = async () => {
      $("btnOnce").disabled = true;
      $("btnOnce").textContent = "Kjører…";
      $("cycle").textContent = "Starter syklus…";
      try {
        const res = await api("/api/once", "POST");
        if (res && res.ok === false) {
          $("err").innerHTML = `<div class="err">${res.reason || "Kunne ikke starte syklus"}</div>`;
          $("btnOnce").disabled = false;
          $("btnOnce").textContent = "Kjør én syklus";
          return;
        }
        $("cycle").textContent = "Syklus i gang (Grok + bøker, 30–90 s)…";
      } catch (e) {
        $("err").innerHTML = `<div class="err">${e.message || e}</div>`;
        $("btnOnce").disabled = false;
        $("btnOnce").textContent = "Kjør én syklus";
      }
    };
    $("btnUpd").onclick = async () => {
      if (!confirm("Hente siste kode og restarte agenten?")) return;
      $("btnUpd").disabled = true;
      try {
        await api("/api/update", "POST");
        $("cycle").textContent = "Oppdaterer… dashboard kommer tilbake om ~20 s.";
      } finally {
        setTimeout(() => { $("btnUpd").disabled = false; refresh(); }, 20000);
      }
    };
    $("cap").onsubmit = async (e) => {
      e.preventDefault();
      const deposited_usd = Number($("dep").value);
      const xai_prepaid_usd = Number($("xai").value);
      await api("/api/meta", "POST", { deposited_usd, xai_prepaid_usd });
      refresh();
    };
    document.querySelectorAll(".tabs button").forEach((b) => {
      b.onclick = () => {
        tab = b.dataset.tab;
        document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("active", x === b));
        if (state) renderPanel(state);
      };
    });
    refresh();
    setInterval(refresh, 4000);
  </script>
</body>
</html>
