<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080c0b" />
  <title>Fjord · Prediksjonsdesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #080c0b; --surface: #121918; --raised: #18211f;
      --fg: #e8eeea; --muted: #8b9c95; --subtle: #5e6e68;
      --border: color-mix(in oklab, #e8eeea 12%, transparent);
      --gain: #3d9b78; --loss: #c45c4a; --warn: #c4a35a; --primary: #d7e0dc;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg);
      font-family: "IBM Plex Sans", system-ui, sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .wrap { max-width: 42rem; margin: 0 auto; padding: 0 1rem 5rem; }
    header { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(12px);
      background: color-mix(in oklab, var(--bg) 92%, transparent); border-bottom: 1px solid var(--border); }
    header .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: .5rem; padding: .7rem 0; }
    h1 { margin: 0; font-size: 1.05rem; font-weight: 600; }
    .eyebrow { font-family: "IBM Plex Mono", monospace; font-size: .65rem; letter-spacing: .14em;
      text-transform: uppercase; color: var(--muted); margin: 0; }
    .pills { display: flex; flex-wrap: wrap; gap: .35rem; }
    .pill { font-family: "IBM Plex Mono", monospace; font-size: .7rem; border: 1px solid var(--border);
      border-radius: 999px; padding: .35rem .7rem; display: inline-flex; align-items: center; gap: .35rem; }
    .dot { width: .4rem; height: .4rem; border-radius: 99px; background: var(--subtle); }
    .on .dot { background: var(--gain); } .off .dot { background: var(--loss); }
    .on { color: var(--gain); } .off { color: var(--loss); }
    .err-line { color: var(--loss); font-size: .8rem; margin: 0 0 .4rem; min-height: 1.1em; }
    .grid4 { display: grid; grid-template-columns: 1fr 1fr; gap: .45rem; margin-top: .75rem; }
    @media (min-width: 640px) { .grid4 { grid-template-columns: repeat(4, minmax(0,1fr)); } }
    .strip { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; margin-top: .45rem; }
    @media (min-width: 640px) { .strip { grid-template-columns: repeat(3, minmax(0,1fr)); } }
    .strip .stat { padding: .55rem .7rem; }
    .strip strong { font-size: .88rem; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: .85rem; padding: .75rem .85rem; }
    .stat span { display: block; color: var(--muted); font-size: .72rem; }
    .stat strong { display: block; margin-top: .15rem; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: .45rem; margin-top: .75rem; }
    @media (min-width: 640px) { .actions { display: flex; flex-wrap: wrap; } }
    .btn { min-height: 44px; border-radius: .7rem; border: 1px solid var(--border);
      background: var(--raised); color: var(--fg); padding: 0 1rem; font-weight: 500; }
    .btn.primary { background: var(--primary); color: var(--bg); border-color: transparent; }
    .btn.danger { background: color-mix(in oklab, var(--loss) 18%, var(--surface)); color: var(--loss);
      border-color: color-mix(in oklab, var(--loss) 35%, transparent); }
    h2 { font-size: .78rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
      color: var(--muted); margin: 1.25rem 0 .5rem; }
    .pos { background: var(--surface); border: 1px solid var(--border); border-radius: .85rem;
      padding: .85rem 1rem; margin-bottom: .45rem; }
    .pos .q { font-size: .95rem; margin: 0 0 .3rem; }
    .pos .meta { font-family: "IBM Plex Mono", monospace; font-size: .72rem; color: var(--muted); line-height: 1.45; }
    .gain { color: var(--gain); } .loss { color: var(--loss); }
    .hint { font-size: .75rem; margin-top: .25rem; color: var(--warn); }
    .empty { color: var(--muted); padding: .5rem 0 1rem; }
    .cycle { color: var(--subtle); font-size: .75rem; margin: .6rem 0 0; line-height: 1.4; font-family: "IBM Plex Mono", monospace; }
    .tabs { display: flex; gap: .15rem; margin-top: 1.1rem; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .tabs button { background: none; border: 0; color: var(--muted); padding: .75rem .85rem; min-height: 44px; }
    .tabs button.active { color: var(--fg); box-shadow: inset 0 -2px 0 var(--primary); }
    .row-item { background: var(--surface); border: 1px solid var(--border); border-radius: .75rem;
      padding: .75rem .9rem; margin-bottom: .4rem; }
    .cap { display: grid; gap: .5rem; grid-template-columns: 1fr; margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--border); }
    @media (min-width: 640px) { .cap { grid-template-columns: 1fr 1fr auto; align-items: end; } }
    .cap label { display: block; color: var(--muted); font-size: .75rem; margin-bottom: .25rem; }
    .cap input { min-height: 44px; width: 100%; border-radius: .6rem; border: 1px solid var(--border);
      background: var(--raised); color: var(--fg); padding: 0 .7rem; }
    .badge { display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: .62rem;
      letter-spacing: .04em; padding: .12rem .45rem; border-radius: 999px; vertical-align: middle; }
    .b-grok { background: #16324f; color: #8ec8ff; }
    .b-kalshi { background: #3f3010; color: #f0c674; }
    .b-complement { background: #0f3d3a; color: #6ee7d8; }
    .b-tape { background: #2a2438; color: #c4b5fd; }
    .b-exit { background: #4a2030; color: #f9a8c4; }
    .b-redeem { background: #143d2e; color: #6ee7b7; }
    .b-ukjent { background: var(--raised); color: var(--muted); }
    .rej { display: flex; flex-wrap: wrap; gap: .3rem; margin: .35rem 0 .15rem; }
    .rej .chip { font-family: "IBM Plex Mono", monospace; font-size: .65rem; border: 1px solid var(--border);
      border-radius: 999px; padding: .2rem .5rem; color: var(--muted); }
    .rej .chip.on { color: var(--warn); border-color: color-mix(in oklab, var(--warn) 40%, transparent); }
    .thesis { font-size: .75rem; color: var(--muted); margin-top: .2rem; line-height: 1.4; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="row">
        <div>
          <p class="eyebrow">Prediksjonsdesk</p>
          <h1>Fjord</h1>
        </div>
        <div class="pills" id="pills"></div>
      </div>
      <p class="err-line" id="errLine"></p>
    </div>
  </header>
  <main class="wrap">
    <div class="grid4" id="stats"></div>
    <div class="strip" id="strip"></div>
    <div class="actions">
      <button class="btn primary" id="btnOn" type="button">Slå på</button>
      <button class="btn danger" id="btnOff" type="button">Slå av</button>
      <button class="btn" id="btnOnce" type="button">Kjør én syklus</button>
      <button class="btn" id="btnUpd" type="button">Oppdater agent</button>
    </div>
    <h2>Posisjoner</h2>
    <div id="positions"></div>
    <p class="cycle" id="cycle"></p>
    <div class="rej" id="rejects"></div>
    <h2>Kjøp / attribution</h2>
    <div class="grid4" id="attr"></div>
    <div class="strip" id="attrSrc"></div>
    <div class="tabs">
      <button class="active" data-tab="log" type="button">Logg</button>
      <button data-tab="fill" type="button">Fills</button>
      <button data-tab="rules" type="button">Regler</button>
    </div>
    <div id="panel"></div>
    <form class="cap" id="cap">
      <div>
        <label for="dep">Innskutt på Polymarket (USD)</label>
        <input id="dep" name="deposited" type="number" min="1" step="0.01" inputmode="decimal" />
      </div>
      <div>
        <label for="xai">xAI-kreditter kjøpt totalt (USD)</label>
        <input id="xai" name="prepaid" type="number" min="0" step="0.01" inputmode="decimal" />
      </div>
      <button class="btn" type="submit">Lagre</button>
    </form>
  </main>
  <script>
    let tab = "log";
    let state = null;
    const tokenKey = "fjord_token";
    const $ = (id) => document.getElementById(id);
    const token = () => sessionStorage.getItem(tokenKey) || new URLSearchParams(location.search).get("token") || "";
    const usd = (n) => (Number(n) || 0).toLocaleString("nb-NO", { style: "currency", currency: "USD", maximumFractionDigits: 2 });
    const signed = (n) => (n > 0.004 ? "+" : n < -0.004 ? "\u2212" : "") + usd(Math.abs(n));
    const pctn = (n) => `${n >= 0 ? "+" : ""}${(n * 100).toFixed(1)} %`;
    const clock = (iso) => {
      if (!iso) return "—";
      const d = new Date(iso);
      return Number.isNaN(d.getTime()) ? "—" : d.toLocaleString("nb-NO", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
    };
    const badge = (src) => {
      const s = String(src || "ukjent").toLowerCase();
      let cls = "b-ukjent";
      if (s === "grok") cls = "b-grok";
      else if (s === "kalshi") cls = "b-kalshi";
      else if (s === "complement") cls = "b-complement";
      else if (s === "tape") cls = "b-tape";
      else if (s === "redeem") cls = "b-redeem";
      else if (s.indexOf("exit") === 0 || s === "flatten") cls = "b-exit";
      const label = s || "ukjent";
      return `<span class="badge ${cls}">${label}</span>`;
    };
    const hoursLabel = (h) => {
      if (h == null || !Number.isFinite(Number(h))) return "—";
      const n = Number(h);
      if (n < 1) return `${Math.round(n * 60)} min`;
      if (n < 48) return `${n.toFixed(1)} t`;
      return `${(n / 24).toFixed(1)} d`;
    };
    const age = (iso) => {
      if (!iso) return "";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "";
      const h = Math.max(0, (Date.now() - d.getTime()) / 3600000);
      if (h < 1) return `${Math.round(h * 60)} min`;
      if (h < 48) return `${h.toFixed(1)} t`;
      return `${Math.round(h / 24)} d`;
    };
    async function api(path, method, body) {
      const headers = {};
      if (token()) headers["X-Dashboard-Token"] = token();
      if (body !== undefined) headers["Content-Type"] = "application/json";
      const r = await fetch(path, {
        method: method || "GET",
        headers,
        credentials: "same-origin",
        body: body !== undefined ? JSON.stringify(body) : undefined,
      });
      if (r.status === 401) {
        const t = window.prompt("Dashboard-token (DASHBOARD_TOKEN i .env)");
        if (t) { sessionStorage.setItem(tokenKey, t); return api(path, method, body); }
        throw new Error("Ingen tilgang");
      }
      const data = await r.json();
      if (!r.ok && r.status !== 409 && r.status !== 400) {
        throw new Error(data.reason || data.error || r.statusText);
      }
      return data;
    }
    function countdown(s) {
      const c = s && s.last_cycle;
      if (!c || !c.ts) return "—";
      if (s.busy) return "kjører";
      const next = new Date(c.ts).getTime() + (s.loop_seconds || 300) * 1000;
      let sec = Math.round((next - Date.now()) / 1000);
      if (sec < 0) sec = 0;
      return `${Math.floor(sec / 60)}m ${String(sec % 60).padStart(2, "0")}s`;
    }
    function pills(s) {
      const on = !s.halted;
      const mode = s.dry_run ? "Paper" : "Live";
      const rel = (s.version && s.version.release) || "";
      $("pills").innerHTML =
        `<span class="pill ${on ? "on" : "off"}"><span class="dot"></span>${on ? mode : "Stoppet"}</span>` +
        (s.busy ? `<span class="pill">Syklus…</span>` : `<span class="pill">neste ${countdown(s)}</span>`) +
        (rel ? `<span class="pill">${rel}</span>` : "") +
        `<span class="pill">maks ${s.max_open || 10} · ${Math.round((s.loop_seconds || 300) / 60)} min</span>`;
    }
    function stats(s) {
      const st = s.stats || {};
      const pnl = st.total || 0;
      const tone = (n) => (n > 0.004 ? "gain" : n < -0.004 ? "loss" : "");
      const cards = [
        ["Egenkapital", usd(s.equity), ""],
        ["Ledig", usd(st.cash != null ? st.cash : s.bankroll), ""],
        ["PnL vs innskutt", `${signed(pnl)} (${pctn(st.total_pct || 0)})`, tone(pnl)],
        ["xAI igjen", s.xai_remaining == null ? "fyll inn" : usd(s.xai_remaining), s.xai_remaining != null && s.xai_remaining < 5 ? "loss" : ""],
      ];
      $("stats").innerHTML = cards.map(([l, v, c]) =>
        `<div class="stat"><span>${l}</span><strong class="${c}">${v}</strong></div>`
      ).join("");
      const lastFill = (s.fills || []).find((f) => !f.dry_run);
      const strip = [
        ["I markedet", `${s.open || 0} · ${usd(st.open_cost || 0)}`, ""],
        ["Siste fill", lastFill ? `${lastFill.side} ${usd(lastFill.cost)}` : "ingen", ""],
        ["I dag", `${signed(st.day || 0)} (${pctn(st.day_pct || 0)})`, tone(st.day || 0)],
        ["7 dager", `${signed(st.week || 0)} (${pctn(st.week_pct || 0)})`, tone(st.week || 0)],
        ["Maks DD", `${signed(st.max_dd_usd || 0)} (${pctn(st.max_dd_pct || 0)})`, (st.max_dd_usd || 0) < -0.004 ? "loss" : ""],
        ["xAI i dag / brukt / igjen", `${usd(st.xai_day || 0)} / ${usd(st.xai_total || 0)} / ${s.xai_remaining == null ? "—" : usd(s.xai_remaining)}`, ""],
      ];
      $("strip").innerHTML = strip.map(([l, v, c]) =>
        `<div class="stat"><span>${l}</span><strong class="${c}">${v}</strong></div>`
      ).join("");
    }
    function renderPositions(s) {
      const el = $("positions");
      const rows = (s.positions || []).slice().sort((a, b) => Math.abs(b.upnl || 0) - Math.abs(a.upnl || 0));
      if (!rows.length) { el.innerHTML = `<p class="empty">Ingen åpne posisjoner.</p>`; return; }
      el.innerHTML = rows.map((p) => {
        const shares = Number(p.shares) || 0;
        const avg = Number(p.avg_cost) || 0;
        const cost = Number(p.cost) || shares * avg;
        const mtm = Number(p.current_value);
        const hasMtm = Number.isFinite(mtm) && mtm > 0;
        const upnlUsd = p.upnl != null ? Number(p.upnl) : (hasMtm ? mtm - cost : null);
        const upnlPct = hasMtm && cost > 0 ? (mtm - cost) / cost : null;
        const mid = Number(p.cur_price);
        const label = p.outcome && p.outcome !== p.side ? `${p.outcome} (${p.side})` : (p.side || "");
        const tone = upnlUsd != null ? (upnlUsd > 0.004 ? "gain" : upnlUsd < -0.004 ? "loss" : "") : "";
        const hint = p.exit_action
          ? `<div class="hint">${p.exit_action}${p.exit_reason ? " · " + p.exit_reason : ""}</div>`
          : "";
        const kg = p.kalshi_gap;
        const ky = Number(p.kalshi_yes);
        const kline = p.kalshi_ticker && Number.isFinite(ky) && ky > 0 && kg != null && Number.isFinite(Number(kg))
          ? `<div class="meta">Kalshi ${p.kalshi_ticker} ${ky.toFixed(2)} vs PM gap ${Number(kg) >= 0 ? "+" : ""}${(Number(kg) * 100).toFixed(0)}c</div>`
          : "";
        const src = p.entry_source || "ukjent";
        const thesis = p.entry_detail
          ? `<div class="thesis">${badge(src)} ${p.entry_detail}</div>`
          : `<div class="thesis">${badge(src)}</div>`;
        return `<div class="pos ${tone}"><p class="q">${p.question || ""}</p>
          <div class="meta ${tone}">${label} · ${shares.toFixed(2)} · ${avg.toFixed(2)} → ${Number.isFinite(mid) && mid > 0 ? mid.toFixed(3) : "—"} · kost ${usd(cost)} · verdi ${hasMtm ? usd(mtm) : "—"} · ${upnlUsd == null ? "—" : signed(upnlUsd)} (${upnlPct == null ? "—" : pctn(upnlPct)}) · ${age(p.opened_ts) || age(p.last_ts)}</div>${thesis}${kline}${hint}</div>`;
      }).join("");
    }
    function cycleLine(s) {
      const c = s.last_cycle;
      if (!c) return "Venter på første syklus.";
      return `skannet ${c.scanned || 0} · grok ${c.grok || c.estimated || 0} · kalshi ${c.kalshi || 0} · solgt ${c.sold != null ? c.sold : (c.exits || 0)} · kjøpt ${c.bought || 0} · redeem_ok ${c.redeem_ok || 0} · neste ${countdown(s)}`;
    }
    function rejects(s) {
      const el = $("rejects");
      if (!el) return;
      const keys = ["confidence=low", "edge_net", "cs_live", "mid_extreme", "short_horizon", "near-res"];
      const counts = (s.last_cycle && s.last_cycle.reject_counts) || {};
      el.innerHTML = keys.map((k) => {
        const n = Number(counts[k] || 0);
        return `<span class="chip ${n ? "on" : ""}">${k} ${n}</span>`;
      }).join("");
    }
    function attrBlock(s) {
      const a = s.attribution || {};
      const wr = a.win_rate || {};
      const risk = a.open_risk || {};
      const tone = (n) => (n > 0.004 ? "gain" : n < -0.004 ? "loss" : "");
      const hold = hoursLabel(a.avg_hold_h);
      const winLine = `${wr.n_win || 0}/${wr.n_closed || 0} (${pctn(wr.pct || 0)}) · ${signed(wr.usd_win || 0)} / ${signed(wr.usd_loss || 0)}`;
      const cards = [
        ["Realized PnL", `${signed(a.realized || 0)} · 24t ${signed(a.realized_24h || 0)} · 7d ${signed(a.realized_7d || 0)}`, tone(a.realized || 0)],
        ["Unrealized PnL", `${signed(a.unrealized || 0)}`, tone(a.unrealized || 0)],
        ["Win rate lukket", winLine, ""],
        ["Expectancy / lukket", usd(a.expectancy || 0), tone(a.expectancy || 0)],
        ["Snitt hold lukket", hold, ""],
        ["Open risk", `${usd(risk.usd || 0)} (${pctn(risk.pct || 0)}) · ${risk.seats || 0} seter`, ""],
      ];
      const attrEl = $("attr");
      if (attrEl) {
        attrEl.innerHTML = cards.map(([l, v, c]) =>
          `<div class="stat"><span>${l}</span><strong class="${c}">${v}</strong></div>`
        ).join("");
      }
      const src = a.by_source || {};
      const names = ["grok", "kalshi", "complement", "exits"];
      const srcEl = $("attrSrc");
      if (srcEl) {
        srcEl.innerHTML = names.map((k) => {
          const row = src[k] || {};
          return `<div class="stat"><span>${badge(k)} fills</span><strong>${row.n || 0} · kjøpt ${usd(row.bought || 0)} · ${signed(row.realized || 0)}</strong></div>`;
        }).join("");
      }
    }
    function renderPanel(s) {
      const el = $("panel");
      if (tab === "fill") {
        if (!s.fills || !s.fills.length) { el.innerHTML = `<p class="empty">Ingen fills.</p>`; return; }
        el.innerHTML = s.fills.map((f) => {
          const src = f.source || "ukjent";
          const detail = f.source_detail || "";
          const q = f.question ? `<p class="q">${f.question}</p>` : "";
          return `<div class="row-item">${q}<p class="q">${badge(src)} ${f.side || ""} ${usd(f.cost)}</p>
           <div class="meta">${clock(f.ts)} · ${Number(f.size || 0).toFixed(2)} @ ${Number(f.price || 0).toFixed(3)} · ${usd(f.cost)} ${f.dry_run ? "· paper" : "· live"}${detail ? " · " + detail : ""}</div></div>`;
        }).join("");
        return;
      }
      if (tab === "rules") {
        el.innerHTML = [
          ["Syklus", "Hvert 5. minutt. Redeem først, deretter exits + Kalshi + tape. Grok hver runde: 15 navn etter 24t-volum, etter dropp (cs_live / mid_extreme / short_horizon). Foretrekk valg, lover, sentralbank, awards, lang crypto, geopolitikk >7d. Én batch. FAK på live bud."],
          ["Redeem", "Hver syklus først: closed / data-api redeemable / (mid≥0,99 og bud≤0,02) → CTF/NegRisk redeem til pUSD. Tapere til 0 lukkes lokalt. Bud ≥ 0,98 på live bok → FAK @ bud (0,99/0,98). Aldri FAK 0,001 på resolvert bok. Aldri hold 0,999. redeem_ok/redeem_err én gang per condition_id, 30 min cooldown."],
          ["Kjøp", "To spor. 1) Rent Kalshi-par (samme serie/møte/utfall, begge mids 0–1): |gap|≥5¢ og ask 0,18–0,82, størrelse 10–14 %. Grok kan ikke blokke. 2) Uten par: Grok confidence≠low OG edge_net≥MIN_NET_EDGE OG YES+NO-ask<0,985. Ingen par er ikke kjøpsforbud. Sports/CS/tennis/Fed/crypto er lov."],
          ["10 seter", "Maks 10 åpne. Ved 10: kun exits og hedge (YES+NO samme marked). Samme kamp/event_key maks 25 % av innskutt samlet. Inntil 75 % av innskutt i markedet."],
          ["Størrelse", "Alt i prosent av innskutt (ellers egenkapital). Gulv 5 %. Sports/turnering/longshot 6–8 %, også mid < 0,40. Kjerne 10–14 %. Hard tak 18 % ett navn. Maks 50 % av ask-dybde og 90 % av kontant. Tynn bok (dybde < 5 %) hoppes. Påfyll kun kjerne ≥ +10 %, aldri average down, aldri rød sports. Aldri stub under 5 %."],
          ["Sports-exits", "Kun live bud. Stopp: bud ≤ avg×0,85 eller bud ≤ 0,03. Ta: +18 % vs avg, deretter trail 8 % under HWM (0,72 → selg ≤ 0,662). FAK på bud, retry −1/−2 tick. Umachet to ganger → reject+bid. Død bok mark ≤ 0,01 eller verdi < 0,1 % av innskutt → closed_dust (ikke Fed)."],
          ["Kjerne-exits", "Stopp −18 % vs avg. Ta bud ≥ 0,92 eller +22 % vs avg. Rent Kalshi-par og Kalshi ≤ PM − 7 ¢ vs kost → selg nå (Grok overstyrer ikke). FAK på live bud + 2 retry."],
          ["Kalshi", "Egen spor. Navngitt par: H25 = hike 25, H26 = >25bps, H0 = no change. Ingen par = vekt 0, blokkerer ikke kjøp. Logg begge mids. Kalshi ≥ PM + 5 ¢ og ask 0,20–0,80 kan bekrefte kjerne-kjøp."],
          ["Sikring", "Ingen daglig handelsstopp. Ingen 85 %-halt. Ingen sports-kjøpsstopp. HALT-fil stopper alt. Exits og redeem kjører hver syklus før Grok."],
        ].map(([k, v]) => `<div class="row-item"><p class="q">${k}</p><div class="meta">${v}</div></div>`).join("");
        return;
      }
      if (!s.decisions.length) { el.innerHTML = `<p class="empty">Ingen logg ennå.</p>`; return; }
      el.innerHTML = s.decisions.map((d) => {
        const tone = (d.action === "sell" || d.action === "sold" || d.action === "live" || d.action === "paper") ? "gain" : (d.action === "error" || d.action === "reject" || d.action === "selling" || d.action === "closed_dust" ? "loss" : "");
        return `<div class="row-item"><p class="q">${d.question || ""}</p>
          <div class="meta ${tone}">${clock(d.ts)} · ${d.action || "—"} · ${d.reason || ""}</div></div>`;
      }).join("");
    }
    function paint(s) {
      state = s;
      pills(s);
      stats(s);
      renderPositions(s);
      $("cycle").textContent = cycleLine(s);
      rejects(s);
      attrBlock(s);
      const st = s.stats || {};
      const depEl = $("dep");
      const xaiEl = $("xai");
      if (depEl && document.activeElement !== depEl) depEl.value = st.deposited != null ? st.deposited : "";
      if (xaiEl && document.activeElement !== xaiEl) xaiEl.value = st.xai_prepaid != null ? st.xai_prepaid : "";
      const upd = s.update || {};
      let err = s.last_error || "";
      if (upd.running) err = err || "Oppdaterer agent…";
      else if (upd.ok === false) err = `Oppdatering feilet: ${upd.reason || "se data/update.log"}`;
      $("errLine").textContent = err;
      $("btnOn").disabled = !s.halted;
      $("btnOff").disabled = !!s.halted;
      $("btnOnce").disabled = !!s.busy;
      $("btnOnce").textContent = s.busy ? "Kjører…" : "Kjør én syklus";
      renderPanel(s);
    }
    async function refresh() {
      try { paint(await api("/api/state")); }
      catch (e) { $("errLine").textContent = "Kan ikke nå desken."; }
    }
    $("btnOn").onclick = async () => { await api("/api/on", "POST"); refresh(); };
    $("btnOff").onclick = async () => { await api("/api/off", "POST"); refresh(); };
    $("btnOnce").onclick = async () => {
      $("btnOnce").disabled = true;
      $("btnOnce").textContent = "Kjører…";
      try {
        const res = await api("/api/once", "POST");
        if (res && res.ok === false) $("errLine").textContent = res.reason || "Kunne ikke starte";
      } catch (e) { $("errLine").textContent = e.message || e; }
    };
    $("btnUpd").onclick = async () => {
      if (!confirm("Hente siste kode og restarte agenten?")) return;
      $("btnUpd").disabled = true;
      try {
        await api("/api/update", "POST");
        $("errLine").textContent = "Oppdaterer… hard-refresh om ~25 s.";
      } catch (e) {
        $("errLine").textContent = e.message || e;
        $("btnUpd").disabled = false;
        return;
      }
      setTimeout(() => { $("btnUpd").disabled = false; refresh(); }, 25000);
    };
    $("cap").onsubmit = async (e) => {
      e.preventDefault();
      await api("/api/meta", "POST", { deposited_usd: Number($("dep").value), xai_prepaid_usd: Number($("xai").value) });
      refresh();
    };
    document.querySelectorAll(".tabs button").forEach((b) => {
      b.onclick = () => {
        tab = b.dataset.tab;
        document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("active", x === b));
        if (state) renderPanel(state);
      };
    });
    refresh();
    setInterval(() => { if (state) pills(state); }, 1000);
    (function tick() {
      const wait = state && state.busy ? 1000 : 4000;
      setTimeout(async () => { await refresh(); tick(); }, wait);
    })();
  </script>
</body>
</html>
