services:
  desk:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8788:8788"
    volumes:
      - ./data:/app/data
      - ./:/app/host:ro
    command: python main.py run
    environment:
      # HALT sjekkes i /app/HALT — kopier filen inn ved behov, eller kjør uten Docker
      PYTHONPATH: /app
